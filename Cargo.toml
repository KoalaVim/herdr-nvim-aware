[package]
name = "herdr-nvim-aware"
version = "0.1.0"
edition = "2021"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
strip = true
lto = true
